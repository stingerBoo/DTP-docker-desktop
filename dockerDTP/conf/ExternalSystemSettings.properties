###############################
########## codeBeamer #########
###############################
# Maximum number of test case results in a single Test Run.
# Used in: Sending test results to codeBeamer.
codeBeamer.import.chunkSize=1000

# Names of the trackers which contains requirements to be integrated with Parasoft DTP
# Used in: 1. Sending test results to codeBeamer. 2. Traceability report 3. Getting the requirements hierarchy with tests 
# The names should be separated with ';' eg. codeBeamer.tracker.requirements=Tracker 1;Tracker 2;Tracker 3
codeBeamer.tracker.requirements=Customer Requirement Specifications;System Requirement Specifications;User Stories;Epics;Requirements;High Level Requirement Specification;Low Level Requirement Specification;

# It is possible to define names of requirement trackers per codeBeamer project by adding project name lead by period sign as a suffix.
# NOTE: In case project name contains space character \u0020 sequence should be used instead.
#codeBeamer.tracker.requirements.Project1=Project1 Requirements
#codeBeamer.tracker.requirements.Project\u00201=Project 1 Requirements

# Names of trackers which contains test cases to be integrated with Parasoft DTP
# Used in: 1. Sending test results to codeBeamer. 2. Getting the requirements hierarchy with tests 
# The names should be separated with ';' eg. codeBeamer.tracker.tests=Tracker 1;Tracker 2;Tracker 3
# NOTE: Parasoft creates "Verifies" relation between a test case and requirement in codeBeamer - please make sure 
#       in your codeBeamer configuration if the "Verifies" relation between the specific test case and requirement trackers is enabled.
codeBeamer.tracker.tests=Test Cases

# It is possible to define names of test case trackers per codeBeamer project by adding project name lead by period sign as a suffix.
# NOTE: In case project name contains space character \u0020 sequence should be used instead.
#codeBeamer.tracker.tests.Project1=Project1 Test Cases
#codeBeamer.tracker.tests.Project\u00201=Project 1 Test Cases

# Names of trackers which contains test runs of test cases to be integrated with Parasoft DTP
# Used in: Sending test results to codeBeamer
# The names should be separated with ';' eg. codeBeamer.tracker.testRuns=Tracker 1;Tracker 2;Tracker 3
#codeBeamer.tracker.testRuns=

# It is possible to define names of test run trackers per codeBeamer project by adding project name lead by period sign as a suffix.
# NOTE: In case project name contains space character \u0020 sequence should be used instead.
#codeBeamer.tracker.testRuns.Project1=Project1 Test Case Runs
#codeBeamer.tracker.testRuns.Project\u00201=Project 1 Test Case Runs
# NOTE: It is possible to specify a mapping between test case trackers and test run trackers based on the respective position in the settings.
# The following settings
# codeBeamer.tracker.tests=TCT1;TCT2;TCT3
# codeBeamer.tracker.testRuns=TRT1;TRT2;TRT3
# mean that test runs of test cases from TCT1 tracker should be created in TRT1 and so on.

#Link template to issue in codeBeamer.
#Used in: Rendering link in DTP to requirement and test in codeBeamer.
codeBeamerIssueUrl=<CODEBEAMER_URL>/issue/<ID>

# Specifies the type and status of new work item for Bug and Task which is created in codeBeamer during creating work items in DTP Violation Explorer and Test Explorer.
# Used in: Creating work items from DTP Violations Explorer and Test Explorer
codeBeamer.workItemType.bug=Bugs
codeBeamer.workItemType.bug.status=New

codeBeamer.workItemType.task=Tasks
codeBeamer.workItemType.task.status=New

# Indicates the path to access the REST API within codeBeamer server. In earlier versions of codeBeamer, such as version 9.5, this path is typically /cb/rest.
codeBeamer.restApi.path=/rest
##############################
############ Jira ############
##############################
#Link template to issue in Jira.
#Used in: Rendering link in DTP to requirement and test in Jira.
jiraIssueUrl=<JIRA_URL>/browse/<ID>

####################################
########## Jira XRay Cloud #########
####################################
# Names of test run statuses in Jira XRay set for specific status in Parasoft DTP.
# Used in: Sending test results to Jira XRay.
jira.xrayCloud.testCaseFindingStatus.pass=PASSED
jira.xrayCloud.testCaseFindingStatus.fail=FAILED
jira.xrayCloud.testCaseFindingStatus.incomplete=ABORTED

# Name of relation between Test and Requirement in Jira XRay Cloud
# Used in: Sending test results to Jira XRay.
jira.xrayCloud.testToRequirementRelationName=Test

# Xray Cloud API URL
# In case of change of current Xray Cloud API Url, there is possibility to define new one:
jira.xrayCloud.restApi.url=https://xray.cloud.getxray.app

##############################
########## Jira XRay #########
##############################
# Names of test run statuses in Jira XRay set for specific status in Parasoft DTP.
# Used in: Sending test results to Jira XRay.
jira.xrayOnPremises.testCaseFindingStatus.pass=PASS
jira.xrayOnPremises.testCaseFindingStatus.fail=FAIL
jira.xrayOnPremises.testCaseFindingStatus.incomplete=ABORTED

# Name of relation between Test and Requirement in Jira XRay
# Used in: Sending test results to Jira XRay.
jira.xrayOnPremises.testToRequirementRelationName=Tests

######### Jira (both Cloud and on-premises)
# Name of issue type in Jira which is considered as a test
# Used in: Sending test results to Jira XRay.
jira.issueType.test=Test

# Name of issue type in Jira which is considered as a requirement
# Used in: 1. Sending test results to Jira XRay. 
# 2. Traceability report - used as a part of default JQL query for getting Jira's issues (the value can be overwritten while defining the traceability widgets).
jira.issueType.requirement=Story

# Specifies Test Type value which is set when a test is created during sending test results from DTP to Jira XRay.
# When both settings are empty, a default Test Type value gets assigned. To specify custom test type both parameters required.
# See DTP user manual for how to determine the values for the settings.
# Used in: Sending test results to Jira XRay
jira.testType.customfieldId=
jira.testType.customfieldValue=

# Specifies the transition ID of the status of Test and Test Execution which is created in Jira during sending test results from DTP to Jira.
# It is useful when you like to set status to some final value e.g. DONE, IMPLEMENTED, etc. - the status values depend on your Jira configuration.
# In order to determine the transitionId for the specific status value, call the Jira API: 
# http://JIRA-ADDRESS/rest/api/2/issue/<TEST-OR-TESTEXECUTION-ID>/transitions 
# See also DTP user manual.
jira.testDone.transitionId=
jira.testExecutionDone.transitionId=

# Specifies the type of new work item for Bug and Task which is created in Jira during creating work items in DTP Violation Explorer and Test Explorer.
# Used in: Creating work items from DTP Violations Explorer and Test Explorer
jira.issueType.bug=Bug
jira.issueType.task=Task

#############################
########## Polarion #########
#############################
# ID of work item types which should be treated as requirements in Parasoft integration. See Polarion Administration > Work Items > Types for the IDs
# Used in: 1. Sending test results to Polarion. 2. Traceability report
polarion.workItemType.requirementIds=softwarerequirement,systemrequirement,requirement,userstory

# ID of work item types which should be treated as Tests in Parasoft integration. See Polarion Administration > Work Items > Types for the IDs
# Used in: Parasoft C/C++ and SOAtest Requirements View - to present Polarion test cases associated with Polarion requirements in Parasoft C/C++ and SOAtest. 
# The values should be a list of IDs separated with ","
polarion.workItemType.testTypeIds=unittestcase,testcase,softwaretestcase,systemtestcase

# ID of work item types which should be treated as tests in Parasoft integration. See Polarion Administration > Work Items > Types for the IDs
# Used in: Sending test results and creating new tests in Polarion, .
polarion.workItemType.createdTestTypeId=unittestcase

# IDs of roles which should be treated as WorkItem - Test relation types. See Polarion Administration > Enumerations > workitem-link-role-enum.xml
# Used in: Parasoft C/C++ and SOAtest Requirements View - to present Polarion test cases associated with Polarion requirements in Parasoft C/C++ and SOAtest. 
# The values should be a list of IDs separated with ",". When field is empty it accepts all role types.
polarion.testCase.workItemLinkRole=

# ID of hyperlink role as configured in Polarion Administration > Enumerations > hyperlink-role-enum.xml
# Used in: Creating work items from DTP Violations Explorer and Test Explorer
polarion.hyperlinkRole=ref_ext

# ID of relation between test and requirement as configured in Polarion Administration > Enumerations > workitem-link-role-enum.xml
# Used in: Sending test results to Polarion.
polarion.requirementStatus.verified=verifies

#Link template to issue in Polarion.
#Used in: Rendering link in DTP to requirement and test in Polarion.
polarionIssueUrl=<POLARION_URL>/polarion/redirect/project/<PROJECT>/workitem?id=<ID>

# Specifies the type of new work item for Issue and Task which is created in Polarion during creating work items in DTP Violation Explorer and Test Explorer.
# Used in: Creating work items from DTP Violations Explorer and Test Explorer
polarion.workItemType.issue=issue
polarion.workItemType.task=task

#############################
######## Jama Connect #######
#############################
jamaIssueUrl=<JAMA_URL>/perspective.req#/items/<ID>

jama.bugSet.name=Defects created by Parasoft DTP

#List of item types related to Sets of Test Cases in Jama project. The values should be a list of Keys separated with ";"
#Used in: 1. Parasoft C/C++ and SOAtest Requirements View - to present Jama test cases associated with Jama requirements in Parasoft C/C++ and SOAtest. 
#2. synchronization process of DTP data with Jama (when adding new Test Cases).
jama.testcase.types=TC;LTC;HTC;VALTC

#List of item types that are excluded from being presented in requirements views. The values should be a list of Keys separated with ";"
#Used in: 1. DTP traceability reports 2. Parasoft C/C++ and SOAtest Requirements View.
jama.item.types.to.skip=BUG;SET;TXT;FLD;TC;LTC;HTC;VALTC

#List of relationship types used to filter appropriate test cases related to requirements. The values should be a list of relationship types names, separated with ";".
#If the setting has no specified values, all the relationship types available in Jama system will be used.
#Used in: Parasoft C/C++ and SOAtest Requirements View - to present Jama test cases associated with Jama requirements in Parasoft C/C++ and SOAtest.
#jama.testcase.relationship.types=Verified by;Validated by 
jama.testcase.relationship.types=

#The relationship type between requirements and test cases used for creating new test case during sending test results from DTP to Jama. If not set, the default relation type in Jama is set. 
jama.sync.testcase.relationship.type=Verified By

#############################
######## Azure DevOps #######
#############################
azuredevops.workItem.url=<AZUREDEVOPS_URL>/<PROJECT>/_workitems/edit/<ID>
#List of work item types treated as requirements in Azure DevOps Traceability reports, Parasoft C/C++ and SOAtest Requirements View and test cases synchronization process.
#The names should be separated with ';'.
azuredevops.workItemType.requirements=Product Backlog Item;User Story;Requirement
# Maximum number of work items used in the url of a request at a time when calling the Azure DevOps server during the syncTestCases operation.
# All results will be synced, but this limits the size of each request to the server to handle api restrictions such as url length limits.
# Used in: Sending test results to Azure DevOps.
azuredevops.syncTestCases.chunkSize=200

# Maximum number of test case ids used in the url of a request at a time when querying the Azure DevOps server for test points data
# during the syncTestCases operation. All results will be synced, but this limits the size of each request to the server to handle
# api restrictions to the url length.
# Used in: Sending test results to Azure DevOps.
azuredevops.syncTestCases.pointsQueryChunkSize=25

